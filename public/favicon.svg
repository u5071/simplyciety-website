  <line x1="2" y1="9" x2="17" y2="16" stroke="#B8965A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="17" y2="16" stroke="#B8965A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="2" y1="23" x2="17" y2="16" stroke="#B8965A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Signal node -->
  <circle cx="17" cy="16" r="2" fill="#B8965A"/>
  <!-- Output signal -->
  <line x1="19" y1="16" x2="30" y2="16" stroke="#B8965A" stroke-width="1.8" stroke-linecap="round"/>
