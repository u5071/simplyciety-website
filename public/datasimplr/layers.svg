<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" fill="none" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#B8965A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#B8965A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16130E"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="planeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2114"/>
      <stop offset="1" stop-color="#0E0C09"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#B8965A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B8965A" stop-opacity=".7"/>
      <stop offset="1" stop-color="#F1DDB0" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="680" height="640" fill="url(#glow)"/>

  <!-- vertical connectors -->
  <g stroke="#B8965A" stroke-opacity=".25" stroke-dasharray="3 5">
    <line x1="100" y1="500" x2="100" y2="140"/>
    <line x1="500" y1="500" x2="500" y2="140"/>
    <line x1="300" y1="600" x2="300" y2="240"/>
  </g>
  <line x1="300" y1="560" x2="300" y2="60" stroke="url(#beam)" stroke-width="1.5"/>

  <!-- Layer 1: RDB (bottom) -->
  <g transform="matrix(1.25 .625 -1.25 .625 300 500)">
    <rect x="-80" y="-80" width="160" height="160" fill="url(#plane)" stroke="#B8965A" stroke-opacity=".45"/>
    <g stroke="#B8965A" stroke-opacity=".3">
      <line x1="-80" y1="-48" x2="80" y2="-48"/><line x1="-80" y1="-16" x2="80" y2="-16"/>
      <line x1="-80" y1="16" x2="80" y2="16"/><line x1="-80" y1="48" x2="80" y2="48"/>
      <line x1="-40" y1="-80" x2="-40" y2="80"/><line x1="0" y1="-80" x2="0" y2="80"/><line x1="40" y1="-80" x2="40" y2="80"/>
    </g>
    <rect x="-80" y="-80" width="160" height="32" fill="#B8965A" fill-opacity=".12"/>
    <rect x="0" y="16" width="40" height="32" fill="#B8965A" fill-opacity=".35"/>
  </g>

  <!-- Layer 2: NoSQL -->
  <g transform="matrix(1.25 .625 -1.25 .625 300 380)">
    <rect x="-80" y="-80" width="160" height="160" fill="url(#plane)" stroke="#B8965A" stroke-opacity=".45"/>
    <g fill="#0B0B0B" stroke="#B8965A" stroke-opacity=".45">
      <rect x="-62" y="-60" width="52" height="64"/>
      <rect x="10" y="-60" width="52" height="64"/>
      <rect x="-26" y="14" width="52" height="50"/>
    </g>
    <g stroke="#B8965A" stroke-opacity=".5">
      <line x1="-54" y1="-48" x2="-24" y2="-48"/><line x1="-54" y1="-38" x2="-18" y2="-38"/><line x1="-54" y1="-28" x2="-30" y2="-28"/>
      <line x1="18" y1="-48" x2="50" y2="-48"/><line x1="18" y1="-38" x2="44" y2="-38"/>
      <line x1="-18" y1="26" x2="14" y2="26"/><line x1="-18" y1="36" x2="8" y2="36"/>
    </g>
  </g>

  <!-- Layer 3: Graph -->
  <g transform="matrix(1.25 .625 -1.25 .625 300 260)">
    <rect x="-80" y="-80" width="160" height="160" fill="url(#plane)" stroke="#B8965A" stroke-opacity=".5"/>
    <g stroke="#B8965A" stroke-opacity=".45">
      <line x1="-44" y1="-40" x2="30" y2="-50"/><line x1="-44" y1="-40" x2="-20" y2="36"/>
      <line x1="30" y1="-50" x2="44" y2="30"/><line x1="-20" y1="36" x2="44" y2="30"/>
      <line x1="30" y1="-50" x2="-20" y2="36"/><line x1="44" y1="30" x2="62" y2="62"/>
    </g>
    <g fill="#0B0B0B" stroke="#B8965A">
      <circle cx="-44" cy="-40" r="9" fill="#B8965A" fill-opacity=".55"/>
      <circle cx="30" cy="-50" r="7"/>
      <circle cx="-20" cy="36" r="8"/>
      <circle cx="44" cy="30" r="10" fill="#B8965A" fill-opacity=".3"/>
      <circle cx="62" cy="62" r="5"/>
    </g>
  </g>

  <!-- Layer 4: Ontology (top) -->
  <g transform="matrix(1.25 .625 -1.25 .625 300 140)">
    <rect x="-80" y="-80" width="160" height="160" fill="url(#planeTop)" stroke="#E0C48E" stroke-opacity=".8"/>
    <g stroke="#E0C48E" stroke-opacity=".55">
      <path d="M0 -42 V-16 M-44 -16 H44 M-44 -16 V12 M0 -16 V12 M44 -16 V12 M-44 36 V56 M-58 56 H-30"/>
    </g>
    <g fill="#0E0C09" stroke="#E0C48E">
      <rect x="-16" y="-58" width="32" height="16" fill="#B8965A" fill-opacity=".5"/>
      <rect x="-58" y="12" width="28" height="24"/>
      <rect x="-14" y="12" width="28" height="24"/>
      <rect x="30" y="12" width="28" height="24"/>
    </g>
  </g>

  <!-- agent spark -->
  <g transform="translate(300 52)">
    <circle r="22" fill="#B8965A" fill-opacity=".12"/>
    <circle r="12" fill="#B8965A" fill-opacity=".25"/>
    <path d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6Z" fill="#F1DDB0"/>
  </g>

  <!-- labels -->
  <g font-size="11" letter-spacing="3" fill="#8A8780">
    <line x1="520" y1="140" x2="560" y2="140" stroke="#E0C48E" stroke-opacity=".6"/>
    <text x="570" y="136" fill="#E0C48E">ONTOLOGY</text>
    <text x="570" y="152" font-size="10" letter-spacing="1" fill="#6A6A6A">meaning</text>
    <line x1="520" y1="260" x2="560" y2="260" stroke="#B8965A" stroke-opacity=".5"/>
    <text x="570" y="256">GRAPH</text>
    <text x="570" y="272" font-size="10" letter-spacing="1" fill="#6A6A6A">relationships</text>
    <line x1="520" y1="380" x2="560" y2="380" stroke="#B8965A" stroke-opacity=".5"/>
    <text x="570" y="376">NOSQL</text>
    <text x="570" y="392" font-size="10" letter-spacing="1" fill="#6A6A6A">documents</text>
    <line x1="520" y1="500" x2="560" y2="500" stroke="#B8965A" stroke-opacity=".5"/>
    <text x="570" y="496">RDB</text>
    <text x="570" y="512" font-size="10" letter-spacing="1" fill="#6A6A6A">tables</text>
    <text x="330" y="56" fill="#E0C48E">AGENTS</text>
  </g>
</svg>
